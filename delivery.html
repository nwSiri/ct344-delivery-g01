<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Delivery request | SwiftDrop</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header><a class="brand" href="index.html">SwiftDrop</a>
        <nav><a href="delivery.html">ส่งพัสดุ</a> · <a href="profile.html">ข้อมูลผู้ใช้</a></nav>
    </header>
    <main class="container narrow">
        <p class="eyebrow">สวัสดีคุณ X</p>
        <h1>Request a delivery</h1>
        <p class="lead">Starter version: every part of two addresses is typed manually.</p>
        <form>
            <h2>Pickup address</h2><label>House / building<input type="text"
                    placeholder="e.g., 99/10"></label><label>Street<input type="text"></label><label>Subdistrict<input
                    type="text"></label><label>District<input type="text"></label><label>Province<input
                    type="text"></label><label>ZIP code<input type="text"></label>
            <h2>Destination address</h2><label>House / building<input type="text"></label><label>Street<input
                    type="text"></label><label>Subdistrict<input type="text"></label><label>District<input
                    type="text"></label><label>Province<input type="text"></label><label>ZIP code<input
                    type="text"></label><button type="button">Get estimate</button>
        </form>
    </main>
</body>

</html>
